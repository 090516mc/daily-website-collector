name: 每日网站收集

# 每天自动运行一次收集并生成 Word 文档。
# cron 使用 UTC 时间：每天 02:00（UTC）= 上午 10:00（北京时间）
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:  # 允许在 Actions 页面手动触发一次，方便测试

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests python-docx

      - name: 运行收集程序
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QQ_MAIL_ADDR: ${{ secrets.QQ_MAIL_ADDR }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          # 周日观测源：程序联网抓取以下页面里的外部链接，整理成“本周新上线网站观察”。用逗号分隔多个。
          WEEKLY_SOURCES: https://haozhan.wang,https://chinesesite.net
        run: python src/main.py

      - name: 提交生成的文档和记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "每日网站推荐 $(date -u +%Y-%m-%d)"
          git push